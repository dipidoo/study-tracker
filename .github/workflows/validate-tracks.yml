# Validate track YAML files on PR / push.
# Checks out dipidoo/study-tracker-content (private) via CONTENT_REPO_PAT and
# runs the local parser smoke-test against it. If the PAT secret is not
# configured, the workflow silently skips — deployments still proceed via
# pages.yml regardless.
name: Validate tracks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no PAT
        id: gate
        run: |
          if [ -z "${{ secrets.CONTENT_REPO_PAT }}" ]; then
            echo "No CONTENT_REPO_PAT secret; skipping track validation."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: dipidoo/study-tracker-content
          token: ${{ secrets.CONTENT_REPO_PAT }}
          path: content
      - if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - if: steps.gate.outputs.skip != 'true'
        run: npm ci
      - if: steps.gate.outputs.skip != 'true'
        run: node scripts/test-parsers.mjs "$PWD/content"
